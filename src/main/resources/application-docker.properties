# Container deployment overrides, activated by SPRING_PROFILES_ACTIVE=docker
# (set in docker-compose.yml). Anything not listed here is inherited from
# application.properties — datasource, Flyway, and resilience4j all still apply.

# Browser origin the frontend is served from. Defaults to the Vite dev server so
# `docker compose up` works unconfigured; set CORS_ALLOWED_ORIGIN to the real
# https:// origin in production. Note this is the *browser's* origin, not the
# backend's — it has nothing to do with the port published on the app container.
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Containers are stopped with SIGTERM, so deploys interrupt in-flight work. An
# OpenF1 fetch can block up to 15s waiting on the client-side rate limiter plus a
# 30s read timeout, which exceeds the 30s default and would get killed mid-request.
# Pairs with server.shutdown=graceful in application.properties.
spring.lifecycle.timeout-per-shutdown-phase=50s
